// Compose compiler stability configuration (referenced from app/build.gradle.kts).
//
// The domain layer is plain Kotlin and must not depend on Compose, so instead of annotating the models
// with @Immutable we declare them stable here. That is safe because:
//  - every model is a data class made only of `val`s, and
//  - the List/Set properties are never mutated after construction (they are always replaced).
// Without this, a `List` property makes Compose treat the whole model as unstable, so list items could not
// be skipped when their data is equal and every visible card recomposed on each database emission.
//
// Do NOT add a type here that exposes mutable state.

com.example.dosediary.domain.model.*
kotlin.collections.List
kotlin.collections.Set
